<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify AI playlist generator | home page</title>
    <link rel="stylesheet" href="style.css">

</head>
<body style="background-color: #121212; color: white; font-family: 'Circular', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">

    <div class="top-nav">
        <button id="profileBtn" class="nav-btn" style="display: none;" onclick="window.location.href='/profile'">
            👤 <span id="profileName">Profile</span>
        </button>
        
        <button class="nav-btn" style="background-color: #1DB954; color: black; border: none;" onclick="window.open('https://open.spotify.com', '_blank')">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="vertical-align: middle; margin-right: 4px;">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            Open Spotify
        </button>
    </div>
    <h1 id="welcomeTitle" style="font-size: 70px; font-weight: 900; margin-bottom: 10px; letter-spacing: -2px;">welcome</h1>
    
    <p style="font-size: 24px; color: #b3b3b3; margin-bottom: 40px; font-weight: 500;">Generate your playlist with AI</p>
    
    <button id="loginButton" style="
        background-color: #1DB954; 
        color: white; 
        font-size: 16px; 
        font-weight: 700; 
        padding: 14px 48px; 
        border: none; 
        border-radius: 500px; 
        cursor: pointer; 
        transition: transform 0.2s, background-color 0.2s;
        text-transform: uppercase;
        letter-spacing: 1px;
    " onmouseover="this.style.backgroundColor='#1ed760'; this.style.transform='scale(1.05)';" 
      onmouseout="this.style.backgroundColor='#1DB954'; this.style.transform='scale(1)';"
      onmousedown="this.style.transform='scale(0.95)';">
        login with Spotify
    </button>

    <div id="status" style="margin-top: 20px; color: #ff4136; font-size: 14px;"></div>

    <script src="app.js"></script>
</body>
</html>
