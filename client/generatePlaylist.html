<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>generate playlist</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; font-size: 16px; width: 300px; }
        /* הוספתי עיצוב למצב disabled לכפתור */
        button { padding: 10px 20px; font-size: 16px; background-color: #1DB954; color: white; border: none; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #results { margin-top: 20px; text-align: left; display: inline-block; direction: ltr; } /* שירים באנגלית משמאל לימין */
        #timerDisplay { margin-top: 15px; font-weight: bold; color: #d32f2f; font-size: 18px; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>🎶how are you feeling today? </h1>
    <input type="text" id="moodInput" placeholder="example: happy, sad, morning workout">
    
    <button id="generateBtn" onclick="generatePlaylist()">generate playlist</button>
    
    <div id="timerDisplay"></div>
    
    <div id="loader" style="display:none;">🤖loading... 
    </div>
    <div id="results"></div>

    <script src="generate.js"></script>
</body>
</html>
