<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>generate playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="main-title">
         how are you feeling today?🎶
    </h1>

    <div class="input-container">
        <input type="text" id="moodInput" class="mood-input" placeholder="example: happy, sad, morning workout">

        <button id="filterBtn" class="filter-btn" onclick="openModal()">
            ➕ Add Filter
        </button>

        <button id="generateBtn" class="generate-btn" onclick="generatePlaylist()">
            generate playlist
        </button>
    </div>

    <div id="timerDisplay"></div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div class="loader-text">AI is mixing your playlist...</div>
    </div>

    <div id="results" class="results-container"></div>

    <div id="filterModal" class="modal">
        <div class="modal-content">
            <h2>Playlist Filters</h2>
            
            <label for="songCountInput">Number of Songs:</label>
            <select id="songCountInput" class="modal-input">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
            </select>

            <label>Genre:</label>
            <input type="text" id="genreInput" class="modal-input" placeholder="e.g. Rock, Jazz, Pop">
            
            <label>Preferred Artist:</label>
            <input type="text" id="artistInput" class="modal-input" placeholder="e.g. Queen, Drake">
            
            <label>Year Range:</label>
            
            <div class="range-values">
                <span>From: <span id="startYearDisplay" class="value-label">1950</span></span>
                <span>To: <span id="endYearDisplay" class="value-label">2026</span></span>
            </div>

            <div class="range-wrapper">
                <div class="slider-track"></div>
                <div class="slider-fill" id="sliderFill"></div>
                
                <input type="range" id="rangeStart" class="range-input" min="1950" max="2026" step="1" value="1950" oninput="updateDualSlider()">
                <input type="range" id="rangeEnd" class="range-input" min="1950" max="2026" step="1" value="2026" oninput="updateDualSlider()">
            </div>
            
            <button class="close-btn" onclick="closeModal()">Confirm & Close</button>
        </div>
    </div>

    <script src="generate.js"></script>
</body>
</html>
