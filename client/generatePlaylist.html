<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify AI playlist generator | generate playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<div class="top-nav">
        <button class="nav-btn" onclick="window.location.href='/'">
            🏠 Home
        </button>
        <button class="nav-btn" onclick="window.location.href='/profile'">
            👤 <span id="profileName">Profile</span>
        </button>
        <button class="nav-btn" style="background-color: #1DB954; color: black; border: none;" onclick="window.open('https://open.spotify.com', '_blank')">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="vertical-align: middle; margin-right: 4px;">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            Open Spotify
        </button>
    </div>
    <h1 class="main-title">
         how are you feeling today?🎶
    </h1>

    <div class="input-container">
        <input type="text" id="moodInput" class="mood-input" placeholder="example: happy, sad, morning workout">

        <button id="filterBtn" class="filter-btn" onclick="openModal()">
            ➕ Add Filter
        </button>

        <button id="generateBtn" class="generate-btn" onclick="generatePlaylist()">
            generate playlist
        </button>
    </div>

    <div id="timerDisplay"></div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div class="loader-text">AI is mixing your playlist...</div>
    </div>

    <div id="results" class="results-container"></div>

    <div id="filterModal" class="modal">
        <div class="modal-content">
            <h2>Playlist Filters</h2>
            
            <label for="songCountInput">Number of Songs:</label>
            <select id="songCountInput" class="modal-input">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
            </select>

            <label>Genre:</label>
            <input type="text" id="genreInput" class="modal-input" placeholder="e.g. Rock, Jazz, Pop">
            
            <label>Preferred Artist:</label>
            <input type="text" id="artistInput" class="modal-input" placeholder="e.g. Queen, Drake">
            
            <label>Year Range:</label>
            
            <div class="range-values">
                <span>From: <span id="startYearDisplay" class="value-label">1950</span></span>
                <span>To: <span id="endYearDisplay" class="value-label">2026</span></span>
            </div>

            <div class="range-wrapper">
                <div class="slider-track"></div>
                <div class="slider-fill" id="sliderFill"></div>
                
                <input type="range" id="rangeStart" class="range-input" min="1950" max="2026" step="1" value="1950" oninput="updateDualSlider()">
                <input type="range" id="rangeEnd" class="range-input" min="1950" max="2026" step="1" value="2026" oninput="updateDualSlider()">
            </div>
            
            <button class="close-btn" onclick="closeModal()">Confirm & Close</button>
        </div>
    </div>
    <div id="customAlertModal" class="modal">
        <div class="modal-content" style="text-align: center; max-width: 300px;">
            <h3 style="margin-top: 0;">message 🔔</h3>
            <p id="customAlertText" style="font-size: 18px; color: #b3b3b3;"></p>
            <button id="customAlertBtn" class="close-btn" >confirm</button>
        </div>
    </div>
    
    <script src="generate.js"></script>
</body>
</html>
