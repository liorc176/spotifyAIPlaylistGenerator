<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify AI playlist generator | Enjoy Your Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="top-nav">
        <button class="nav-btn" onclick="window.location.href='/'">
            🏠 Home
        </button>
        <button class="nav-btn" onclick="window.location.href='/generatePlaylist'">
            ✨ Create Playlist
        </button>
        <button class="nav-btn" onclick="window.location.href='/profile'">
            👤 <span id="profileName">Profile</span>
        </button>
        <button class="nav-btn" style="background-color: #1DB954; color: black; border: none;" onclick="window.open('https://open.spotify.com', '_blank')">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="vertical-align: middle; margin-right: 4px;">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            Open Spotify
        </button>
    </div>
    <h1 class="main-title">✨ Your Playlist is Ready! ✨</h1>
    
    <div class="player-container">
        <div id="playerWrapper" style="width: 100%;"></div>

        <a id="spotifyLink" href="#" target="_blank" class="save-spotify-btn" style="text-decoration: none;">
            Open in Spotify Website 🎧
        </a>

        <button onclick="window.location.href='/generatePlaylist'" class="save-spotify-btn secondary-btn">
            Create Another Playlist ↺
        </button>
        <div class="share-container">
            <p>Liked the playlist? Share with your freinds</p>
            <div class="share-buttons">
                <a id="share-whatsapp" target="_blank" class="share-btn whatsapp">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a id="share-facebook" target="_blank" class="share-btn facebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </a>
                <a id="share-linkedin" target="_blank" class="share-btn linkedin">
                    <i class="fab fa-linkedin-in"></i> LinkedIn
                </a>
            </div>
        </div>
    </div>

    <script src="play.js"></script>
</body>
</html>
